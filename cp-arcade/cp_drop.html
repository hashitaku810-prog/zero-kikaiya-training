<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09111f">
<title>CP DROP | スマホ落ちモノゲーム</title>
<style>
* {box-sizing:border-box}
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
html,body{margin:0;min-height:100%;background:#09111f;color:#f1f6ff}
body{display:flex;justify-content:center;align-items:flex-start;padding:10px 10px 20px;overscroll-behavior-y:contain}
.cpdrop{--cyan:#5ce9d2; width:min(100%,430px);margin:auto;user-select:none;-webkit-user-select:none}
.mast{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 9px}
.brand{display:flex;align-items:center;gap:10px}
.brandmark{height:36px;width:36px;display:grid;grid-template-columns:repeat(2,12px);grid-template-rows:repeat(2,12px);gap:3px;place-content:center;background:#172338;border:1px solid #2e4a60;border-radius:10px;transform:rotate(-8deg)}
.brandmark i{display:block;background:#54e7d1;border-radius:3px}.brandmark i:nth-child(2){background:#bc8aff}.brandmark i:nth-child(3){background:#6a9fff}.brandmark i:nth-child(4){background:#ffbc6d}
.eyebrow{font-size:9px;color:#8da8bd;font-weight:800;letter-spacing:1.6px}
h1{font-size:22px;margin:-2px 0 0;letter-spacing:1px;line-height:1.2}
.mast-right{display:flex;gap:6px;align-items:center}
.pill{font-size:10px;font-weight:900;letter-spacing:.4px;border:1px solid #2d455c;background:#13243a;color:#b4d0e3;padding:7px 9px;border-radius:999px}
.top-btn{border:1px solid #28445a;background:#15263c;color:#c8e1ed;border-radius:11px;padding:7px 10px;font-size:13px;font-weight:800;min-height:36px;touch-action:manipulation}
.top-btn:active{transform:scale(.97)}
.scorebar{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:6px;margin-bottom:9px}
.stat{border:1px solid #243b52;border-radius:11px;padding:7px 9px;background:linear-gradient(180deg,#172940,#101e30);min-height:56px}
.stat .slabel{font-size:9px;letter-spacing:1.2px;color:#7e9bb0;font-weight:900}
.stat .svalue{font-size:18px;letter-spacing:.4px;font-weight:900;line-height:1.3;font-variant-numeric:tabular-nums}
.stat:first-child .svalue{color:#6ef1d8}
.playzone{display:grid;grid-template-columns:minmax(0,280px) 82px;gap:9px;align-items:start;justify-content:center}
.board-shell{position:relative;overflow:hidden;border:2px solid #31516d;background:#101b2d;border-radius:10px;box-shadow:0 0 0 1px #0b1726,0 15px 35px #0004,0 0 30px #2e9b8a10}
#cp-board{width:100%;aspect-ratio:10 / 18;height:auto;display:block;touch-action:none}
.side{display:flex;flex-direction:column;gap:8px}
.side-card{background:#132338;border:1px solid #283f58;border-radius:12px;padding:10px 5px;text-align:center}
.side-label{font-size:10px;font-weight:900;letter-spacing:1.1px;color:#83a1b5;margin-bottom:6px}
#cp-next{width:100%;max-width:76px;height:auto;display:block;margin:0 auto}
.level-value{font-size:26px;font-weight:900;line-height:1.15;color:#e2edff;font-variant-numeric:tabular-nums}
.level-sub{font-size:9px;color:#6e90a6;margin-top:5px}
.tip-card{border:1px dashed #36536d;border-radius:11px;padding:9px 6px;text-align:center;color:#8eacc1;font-size:10px;line-height:1.5}
.tip-card strong{color:#a7f6e9}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:16px;background:rgba(7,15,28,.86);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.overlay.hidden{display:none}
.overlay-icon{font-size:35px;line-height:1.1;margin-bottom:8px;color:#6eeedb}
.overlay-title{font-size:23px;font-weight:950;letter-spacing:.6px;margin-bottom:8px}
.overlay-desc{font-size:12px;color:#abc4d6;line-height:1.8;margin-bottom:17px}
.overlay button{min-width:155px;background:#5ae7cf;color:#0c2630;border:none;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:950;box-shadow:0 6px 22px #20d6bc33;touch-action:manipulation}
.overlay button:active{transform:scale(.96)}
.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 1.23fr;gap:6px;margin-top:10px}
.ctrl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#172c45;border:1px solid #335573;border-bottom:3px solid #274560;border-radius:12px;color:#e1f1ff;min-height:58px;padding:4px 1px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.ctrl .glyph{font-size:27px;font-weight:900;line-height:1}
.ctrl small{font-size:9px;color:#9fc2d5;font-weight:800}
.ctrl:active,.ctrl.is-held{transform:translateY(2px);border-bottom-width:1px;background:#244662}
.ctrl.drop{background:linear-gradient(160deg,#55e9d3,#22bda9);border-color:#3ee3c9;border-bottom-color:#178a7d;color:#08282b}
.ctrl.drop small{color:#174948}.ctrl.drop .glyph{font-size:28px}
.help{margin:10px 1px 0;text-align:center;color:#7594a9;font-size:10px;line-height:1.6}
.help b{color:#a0c4d9}
@media(max-width:350px){body{padding:7px 7px 16px}.playzone{grid-template-columns:minmax(0,1fr) 72px;gap:6px}.scorebar{gap:5px}.stat{padding:6px 7px;min-height:51px}.stat .svalue{font-size:16px}.controls{gap:4px}.ctrl{min-height:55px}.ctrl .glyph{font-size:24px}}
@media(max-height:680px) and (min-width:375px){.playzone{grid-template-columns:minmax(0,252px) 78px}.stat{min-height:51px}.ctrl{min-height:54px}}

.cp-arcade-return{display:inline-flex;align-items:center;gap:5px;color:#a9cff4;font-size:12px;font-weight:800;text-decoration:none;padding:4px 4px 9px;min-height:28px;touch-action:manipulation}.cp-arcade-return:active{opacity:.6}
</style>
</head>
<body>
<div class="cpdrop" id="cpdrop-game-v1">
  <a href="./index.html" class="cp-arcade-return">‹ ゲーム一覧へ戻る</a>
  <header class="mast">
    <div class="brand"><span class="brandmark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><div><div class="eyebrow">POCKET ARCADE / 01</div><h1>CP DROP</h1></div></div>
    <div class="mast-right"><span class="pill" id="cp-state">READY</span><button type="button" class="top-btn" id="cp-pause">Ⅱ</button></div>
  </header>
  <section class="scorebar" aria-label="ゲーム成績">
    <div class="stat"><div class="slabel">SCORE</div><div class="svalue" id="cp-score">000000</div></div>
    <div class="stat"><div class="slabel">LINES</div><div class="svalue" id="cp-lines">0</div></div>
    <div class="stat"><div class="slabel">BEST</div><div class="svalue" id="cp-best">0</div></div>
  </section>
  <section class="playzone">
    <div class="board-shell">
      <canvas id="cp-board" width="300" height="540" aria-label="落ちモノゲームの盤面"></canvas>
      <div id="cp-overlay" class="overlay">
        <div class="overlay-icon" id="cp-overlay-icon">▦</div>
        <div class="overlay-title" id="cp-overlay-title">READY?</div>
        <div class="overlay-desc" id="cp-overlay-desc">同じ色じゃなくてもOK！<br>横一列そろえると消えるで ✨</div>
        <button type="button" id="cp-overlay-btn">ゲーム開始 ▶</button>
      </div>
    </div>
    <aside class="side">
      <div class="side-card"><div class="side-label">NEXT</div><canvas id="cp-next" width="80" height="80" aria-label="次のブロック"></canvas></div>
      <div class="side-card"><div class="side-label">LEVEL</div><div class="level-value" id="cp-level">01</div><div class="level-sub">速度UP!</div></div>
      <div class="tip-card"><strong>操作のコツ</strong><br>盤面タップで回転<br>下へスワイプで一気落とし</div>
    </aside>
  </section>
  <div class="controls" aria-label="タッチ操作ボタン">
    <button type="button" class="ctrl" data-act="left" aria-label="左に動かす"><span class="glyph">←</span><small>左</small></button>
    <button type="button" class="ctrl" data-act="rotate" aria-label="回転"><span class="glyph">↻</span><small>回転</small></button>
    <button type="button" class="ctrl" data-act="right" aria-label="右に動かす"><span class="glyph">→</span><small>右</small></button>
    <button type="button" class="ctrl" data-act="down" aria-label="下に動かす"><span class="glyph">↓</span><small>下</small></button>
    <button type="button" class="ctrl drop" data-act="drop" aria-label="一気に落とす"><span class="glyph">⤓</span><small>一気落とし</small></button>
  </div>
  <p class="help">タッチ操作対応 <b>・</b> キーボードもOK（← → ↓ ↑ / Space / P）<br>ベストスコアは端末内に保存されるで</p>
</div>
<script>
(()=>{
  'use strict';
  const root=document.getElementById('cpdrop-game-v1');
  if(!root || root.dataset.ready==='1')return;
  root.dataset.ready='1';
  const $=s=>root.querySelector(s), canvas=$('#cp-board'), ctx=canvas.getContext('2d'), nextCanvas=$('#cp-next'), nc=nextCanvas.getContext('2d');
  const W=10,H=18,CELL=30;
  const SHAPES={
    I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],
    S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],
    J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]
  };
  const COLORS={I:'#5bdeed',O:'#ffd36f',T:'#bf90fd',S:'#64e9a9',Z:'#fb8299',J:'#6d9efb',L:'#ffae70'};
  const state={board:[],piece:null,next:null,bag:[],score:0,lines:0,level:1,best:0,started:false,paused:false,over:false,fall:0,last:0};
  try{state.best=Number(localStorage.getItem('cpdrop-best-v1'))||0}catch(e){}
  const empty=()=>Array.from({length:H},()=>Array(W).fill(''));
  function pick(){if(!state.bag.length){state.bag=Object.keys(SHAPES);for(let i=state.bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[state.bag[i],state.bag[j]]=[state.bag[j],state.bag[i]]}}return state.bag.pop()}
  function collides(matrix,px,py){for(let y=0;y<matrix.length;y++)for(let x=0;x<matrix[y].length;x++){if(!matrix[y][x])continue;const X=px+x,Y=py+y;if(X<0||X>=W||Y>=H||(Y>=0&&state.board[Y][X]))return true}return false}
  function spawn(){const t=state.next??pick();state.next=pick();const m=SHAPES[t].map(r=>r.slice());state.piece={t,m,x:Math.floor((W-m[0].length)/2),y:0};if(collides(m,state.piece.x,state.piece.y))end();drawNext()}
  function newGame(){state.board=empty();state.bag=[];state.next=pick();state.score=0;state.lines=0;state.level=1;state.started=true;state.paused=false;state.over=false;state.fall=0;state.last=performance.now();spawn();hideOverlay();update();draw()}
  function end(){state.over=true;state.started=false;updateBest();showOverlay('GAME OVER','スコア '+state.score.toLocaleString('ja-JP')+' 点！<br>もう一回チャレンジする？','もう一度 ▶','✦');update()}
  function updateBest(){if(state.score>state.best){state.best=state.score;try{localStorage.setItem('cpdrop-best-v1',String(state.best))}catch(e){}}}
  function update(){updateBest();$('#cp-score').textContent=String(state.score).padStart(6,'0');$('#cp-lines').textContent=state.lines;$('#cp-best').textContent=state.best.toLocaleString('ja-JP');$('#cp-level').textContent=String(state.level).padStart(2,'0');$('#cp-state').textContent=state.over?'END':state.paused?'PAUSE':state.started?'PLAY':'READY';$('#cp-pause').textContent=state.paused?'▶':'Ⅱ'}
  function showOverlay(title,desc,button,icon){$('#cp-overlay-title').textContent=title;$('#cp-overlay-desc').innerHTML=desc;$('#cp-overlay-btn').textContent=button;$('#cp-overlay-icon').textContent=icon;$('#cp-overlay').classList.remove('hidden')}
  function hideOverlay(){$('#cp-overlay').classList.add('hidden')}
  function pause(){if(state.over||!state.started)return;state.paused=!state.paused;state.last=performance.now();state.fall=0;if(state.paused)showOverlay('PAUSED','一休み中やで ☕','つづける ▶','Ⅱ');else hideOverlay();update()}
  function move(dx){if(!state.started||state.paused)return;const p=state.piece;if(!collides(p.m,p.x+dx,p.y))p.x+=dx;draw()}
  function rotate(){if(!state.started||state.paused)return;const p=state.piece;const r=p.m[0].map((_,x)=>p.m.map(row=>row[x]).reverse());for(const dx of [0,-1,1,-2,2])if(!collides(r,p.x+dx,p.y)){p.x+=dx;p.m=r;break}draw()}
  function settle(){const p=state.piece;for(let y=0;y<p.m.length;y++)for(let x=0;x<p.m[y].length;x++)if(p.m[y][x]){const yy=p.y+y;if(yy<0){end();return}state.board[yy][p.x+x]=p.t}let n=0;for(let y=H-1;y>=0;y--){if(state.board[y].every(Boolean)){state.board.splice(y,1);state.board.unshift(Array(W).fill(''));n++;y++}}if(n){state.lines+=n;state.score+=[0,100,300,500,800][n]*state.level;state.level=1+Math.floor(state.lines/10)}spawn();update()}
  function step(){if(!state.started||state.paused)return;const p=state.piece;if(!collides(p.m,p.x,p.y+1))p.y++;else settle();draw()}
  function softDrop(){if(!state.started||state.paused)return;const p=state.piece;if(!collides(p.m,p.x,p.y+1)){p.y++;state.score++;update()}else settle();state.fall=0;draw()}
  function hardDrop(){if(!state.started||state.paused)return;const p=state.piece;let n=0;while(!collides(p.m,p.x,p.y+1)){p.y++;n++}state.score+=n*2;settle();state.fall=0;draw()}
  function tile(g,x,y,size,color,ghost=false){const a=x*size,b=y*size;if(ghost){g.fillStyle='rgba(150,215,225,.09)';g.fillRect(a+2,b+2,size-4,size-4);g.strokeStyle='rgba(160,228,238,.58)';g.lineWidth=2;g.strokeRect(a+3,b+3,size-6,size-6);return}g.fillStyle='rgba(0,0,0,.35)';g.fillRect(a+2,b+3,size-3,size-3);g.fillStyle=color;g.fillRect(a+2,b+2,size-5,size-5);g.fillStyle='rgba(255,255,255,.28)';g.fillRect(a+4,b+4,size-9,3);g.fillStyle='rgba(0,0,0,.13)';g.fillRect(a+size-7,b+5,3,size-10)}
  function draw(){ctx.fillStyle='#0e1b2e';ctx.fillRect(0,0,300,540);for(let y=0;y<H;y++)for(let x=0;x<W;x++){ctx.fillStyle=(x+y)%2?'#111f33':'#142238';ctx.fillRect(x*CELL+1,y*CELL+1,CELL-2,CELL-2);if(state.board[y]&&state.board[y][x])tile(ctx,x,y,CELL,COLORS[state.board[y][x]])}if(state.piece&&!state.over){const p=state.piece;let gy=p.y;while(!collides(p.m,p.x,gy+1))gy++;for(let y=0;y<p.m.length;y++)for(let x=0;x<p.m[y].length;x++){if(!p.m[y][x])continue;if(gy+y>=0)tile(ctx,p.x+x,gy+y,CELL,COLORS[p.t],true)}for(let y=0;y<p.m.length;y++)for(let x=0;x<p.m[y].length;x++)if(p.m[y][x]&&p.y+y>=0)tile(ctx,p.x+x,p.y+y,CELL,COLORS[p.t])}}
  function drawNext(){nc.fillStyle='#132338';nc.fillRect(0,0,80,80);if(!state.next)return;const m=SHAPES[state.next],s=17,x0=(80-m[0].length*s)/2,y0=(80-m.length*s)/2;nc.save();nc.translate(x0,y0);for(let y=0;y<m.length;y++)for(let x=0;x<m[y].length;x++)if(m[y][x])tile(nc,x,y,s,COLORS[state.next]);nc.restore()}
  function frame(now){const d=Math.min(now-state.last||0,120);state.last=now;if(state.started&&!state.paused&&!state.over){state.fall+=d;const speed=Math.max(105,840*Math.pow(.85,state.level-1));if(state.fall>=speed){state.fall=0;step()}}requestAnimationFrame(frame)}
  function act(a){if(!state.started&&!state.paused)return;if(a==='left')move(-1);else if(a==='right')move(1);else if(a==='rotate')rotate();else if(a==='down')softDrop();else if(a==='drop')hardDrop()}
  root.querySelectorAll('.ctrl').forEach(btn=>{let delay=null,interval=null;const clear=()=>{if(delay!==null)clearTimeout(delay);if(interval!==null)clearInterval(interval);delay=interval=null;btn.classList.remove('is-held')};btn.addEventListener('pointerdown',e=>{e.preventDefault();clear();const a=btn.dataset.act;btn.classList.add('is-held');act(a);if(a==='left'||a==='right'||a==='down')delay=setTimeout(()=>{interval=setInterval(()=>act(a),75)},210)});['pointerup','pointercancel','pointerleave','lostpointercapture'].forEach(evt=>btn.addEventListener(evt,clear));btn.addEventListener('contextmenu',e=>e.preventDefault())});
  let gesture=null;canvas.addEventListener('pointerdown',e=>{if(!state.started||state.paused)return;gesture={x:e.clientX,y:e.clientY};canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointerup',e=>{if(!gesture)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;gesture=null;const ax=Math.abs(dx),ay=Math.abs(dy);if(ax<18&&ay<18)rotate();else if(ay>ax&&dy>25)hardDrop();else if(ay>ax&&dy< -25)rotate();else if(ax>20){const rect=canvas.getBoundingClientRect();const steps=Math.min(5,Math.max(1,Math.round(ax/(rect.width/10))));for(let i=0;i<steps;i++)move(dx>0?1:-1)}});canvas.addEventListener('pointercancel',()=>gesture=null);
  $('#cp-overlay-btn').addEventListener('click',()=>{if(state.paused)pause();else newGame()});$('#cp-pause').addEventListener('click',()=>{if(state.over||!state.started){newGame()}else pause()});
  document.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' ','p','P'].includes(e.key))return;const el=e.target;if(el&&(['INPUT','TEXTAREA','SELECT'].includes(el.tagName)||el.isContentEditable))return;e.preventDefault();if(e.key==='p'||e.key==='P'){pause();return}if(!state.started||state.paused)return;switch(e.key){case 'ArrowLeft':move(-1);break;case 'ArrowRight':move(1);break;case 'ArrowUp':rotate();break;case 'ArrowDown':softDrop();break;case ' ':hardDrop();break}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.started&&!state.paused)pause()});
  state.board=empty();update();draw();drawNext();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
