<html lang="ja">
<head>

<meta name="description" content="CP QUEST — あしたをつなぐ修理屋。探索・謎解き・修理・選択で進む物語RPG。第2章は全5ステージ公開中。">
<title>CP QUEST｜あしたをつなぐ修理屋</title>
<style>
:root{--bg:#080c19;--panel:#111a2d;--panel2:#17233a;--edge:#32425d;--ink:#eef5fc;--muted:#a4b5cb;--cyan:#87ecd8;--amber:#f5c578;--rose:#f1889b;--blue:#81b2ef}
*{box-sizing:border-box}html{height:100%;background:var(--bg)}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;min-height:100%;background:radial-gradient(ellipse at 50% -25%,#304064 0%,#101b31 42%,#080c19 75%)}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}button:disabled{opacity:.35;cursor:not-allowed}
.shell{max-width:485px;margin:auto;padding:10px 10px calc(14px + env(safe-area-inset-bottom));}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 3px 10px}
.brand{display:flex;align-items:center;gap:10px}.logo{border:1px solid #637aa0;width:43px;height:43px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(155deg,#2a4b66,#111b31);box-shadow:inset 0 1px 8px #80d9e522;color:#c4fff1;font-weight:900;font-size:20px}.brand h1{font-size:19px;margin:0;letter-spacing:.12em;line-height:1.1}.brand small{display:block;margin-top:4px;color:var(--muted);font-size:10px;letter-spacing:.045em}.top-actions{display:flex;align-items:center;gap:6px}.top-actions button{width:39px;height:39px;border:1px solid var(--edge);border-radius:11px;color:#c7d8e8;background:#162238;font-size:16px}
.status{border:1px solid #32415e;background:linear-gradient(140deg,#18253b,#111a2d);border-radius:14px;padding:10px 12px;margin-bottom:9px;box-shadow:0 6px 30px #0002}
.stagehead{display:flex;align-items:center;justify-content:space-between;gap:8px}.stagehead strong{font-size:14px;letter-spacing:.01em}.stagehead span{font-size:10px;color:var(--amber);font-weight:900;letter-spacing:.1em}
.progress{display:flex;gap:5px;margin:9px 0 8px}.progress span{height:4px;background:#3d4965;border-radius:99px;flex:1}.progress .done{background:#7be6c9}.progress .current{background:#ffcb82;box-shadow:0 0 8px #ffcb8260}
.metarow{display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--muted);font-size:11px;margin-bottom:6px}.health{display:flex;gap:2px;align-items:center}.heart{color:var(--rose);font-size:13px}.heart.lost{color:#3c5264}.objective{font-size:12px;line-height:1.45;color:#daeafb;min-height:18px}.objective b{color:var(--cyan)}
.frame{position:relative;border-radius:14px;overflow:hidden;border:2px solid #45657e;box-shadow:0 8px 35px #0006,0 0 20px #4a91b016;background:#091424}.frame::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 34px #0009}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:none;cursor:crosshair}
.mapkey{display:flex;justify-content:space-between;gap:8px;margin:6px 2px 8px;color:#9fb5c8;font-size:10px;line-height:1.35}.mapkey #near{color:#ffdfa3;font-weight:600;text-align:right}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:11px;align-items:center}.dpad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,48px);gap:5px}.ctl{border:1px solid #485b78;border-radius:12px;background:linear-gradient(#253551,#19263d);color:#e7f4ff;font-size:21px;font-weight:900;touch-action:none;user-select:none;box-shadow:inset 0 1px #819cb52b,0 3px 0 #0b1424}.ctl:active,.ctl.active{transform:translateY(2px);box-shadow:inset 0 1px 8px #0007;background:#3a5372}.ctl.up{grid-column:2;grid-row:1}.ctl.left{grid-column:1;grid-row:2}.ctl.down{grid-column:2;grid-row:2}.ctl.right{grid-column:3;grid-row:2}.dpad .cap{grid-column:1;grid-row:1;display:grid;align-items:center;color:#607b92;font-size:10px;text-align:center}.dpad .hint{grid-column:3;grid-row:1;display:grid;place-items:center;color:#8097ad;font-size:10px;text-align:center}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.primary{grid-column:1/3;min-height:49px;border:1px solid #a8f8e6;border-radius:12px;color:#102b38;font-size:17px;font-weight:900;background:linear-gradient(#b4fff1,#70d8cc);box-shadow:0 3px 0 #1b6171}.secondary{border:1px solid #556788;color:#e8effc;background:#21304a;border-radius:11px;min-height:45px;font-weight:800;font-size:12px}.primary:active,.secondary:active{transform:translateY(1px)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:10px;color:#748aa5;margin:12px 2px 0}.foot button{color:#b4c9dc;background:none;border:0;text-decoration:underline;font-size:11px;padding:4px}
.toast{position:fixed;bottom:calc(165px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(8px);background:#122d3aeb;border:1px solid #70cbb1;color:#e5fff8;border-radius:12px;padding:11px 15px;min-width:min(350px,90vw);max-width:90vw;font-size:13px;line-height:1.4;text-align:center;z-index:20;box-shadow:0 14px 30px #0008;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.overlay{position:fixed;inset:0;z-index:30;background:#030a19dd;display:flex;justify-content:center;align-items:center;padding:14px;backdrop-filter:blur(5px)}.overlay.hidden{display:none}.modal{background:linear-gradient(165deg,#202c47,#101c30 65%,#111729);border:1px solid #7184a1;border-radius:20px;width:min(425px,100%);max-height:min(91vh,850px);overflow:auto;padding:22px 19px 18px;box-shadow:0 22px 80px #000b,0 0 35px #6787b015;position:relative}.modal:before{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--cyan),var(--amber),transparent);border-radius:99px;margin-bottom:13px}.modal h2{font-size:21px;margin:0 0 10px;line-height:1.4;letter-spacing:.02em}.modal p{font-size:13px;line-height:1.85;margin:9px 0;color:#d0dfef}.modal .eyebrow{color:var(--amber);font-size:10px;font-weight:900;letter-spacing:.14em;margin-bottom:8px}.modal strong{color:#e4fff4}.modal .muted{color:#9facc2;font-size:12px}.modal .speech{margin:13px 0 20px;border-left:3px solid #72dbc7;padding:6px 0 6px 12px;color:#e5edf7;min-height:90px;font-size:15px;line-height:1.9;white-space:pre-line}.modal .speaker{color:var(--amber);font-size:12px;font-weight:900;letter-spacing:.06em}.modal .modalbuttons{display:flex;flex-direction:column;gap:9px;margin-top:16px}.modal button.opt{width:100%;min-height:45px;padding:11px 14px;border-radius:12px;color:#102836;background:linear-gradient(#bdfff1,#83dcd5);border:1px solid #d6fff5;font-size:13px;font-weight:900;text-align:center}.modal button.opt.alt{background:#1b2d43;border:1px solid #677f99;color:#e5f5ff}.modal button.opt.warn{background:#472635;border:1px solid #a7717d;color:#ffe7e8}.modal button.opt:disabled{opacity:.38}.modal .choice-desc{font-size:11px;color:#aac0d5;line-height:1.6;text-align:left;margin-top:4px}.modal .tag{font-size:10px;color:#9be8ce;background:#163b40;border:1px solid #4c9999;padding:4px 7px;border-radius:99px;display:inline-block}.modal .separator{height:1px;background:#52607c55;margin:15px 0}
.circuit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-width:270px;margin:15px auto 12px}.wire{aspect-ratio:1;border:1px solid #546681;background:#14283c;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:2px;touch-action:manipulation}.wire.on{background:#19484c;border-color:#87f8df;box-shadow:0 0 13px #31d0bc3a}.wire svg{width:100%;height:100%;max-width:75px}.wire:active{background:#2c6871}.puzzleCaption{font-size:11px;color:#b4c7d9;text-align:center;margin-top:5px}.sequence{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.sequence button{background:#233751;border:1px solid #6c86a0;border-radius:10px;padding:11px 4px;color:#effaff;font-size:12px}.sequence button span{display:block;font-size:24px;margin-bottom:6px}.sequence button.selected{background:#26776d;border-color:#b3ffe9}.feedback{color:#f9cf8b;min-height:24px;font-size:12px;text-align:center}
.journal{max-height:42vh;overflow:auto;padding-right:3px}.journalentry{margin:10px 0;border-left:2px solid #618da4;padding:6px 9px;background:#16253b88}.journalentry h3{margin:0 0 5px;font-size:13px;color:#b4f6e5}.journalentry p{margin:0;font-size:12px;line-height:1.6}
.title-logo{text-align:center;font-size:30px;letter-spacing:.1em;font-weight:1000;line-height:1.1;color:#d8fff4;text-shadow:0 0 24px #7af9d644;margin:10px 0 8px}.title-sub{text-align:center;font-size:13px;color:#e6c991;letter-spacing:.11em}.title-hero{height:136px;margin:16px 0;background:radial-gradient(ellipse at 50% 80%,#fbbe8050,transparent 55%),linear-gradient(#142641,#101c2a 55%,#101925);border-radius:12px;overflow:hidden;position:relative;border:1px solid #6a778a60}.title-hero:before{content:"";position:absolute;bottom:0;left:0;right:0;height:55%;background:repeating-linear-gradient(90deg,#0b1826 0 25px,#12283a 25px 38px,#061424 38px 73px);clip-path:polygon(0 45%,7% 35%,7% 10%,15% 10%,15% 54%,28% 54%,28% 28%,33% 28%,33% 62%,46% 62%,46% 22%,51% 22%,51% 69%,62% 69%,62% 35%,68% 35%,68% 80%,79% 80%,79% 28%,86% 28%,86% 57%,100% 57%,100% 100%,0 100%)}.title-hero .light{position:absolute;left:77%;bottom:22px;background:#ffeab5;border-radius:50%;width:9px;height:9px;box-shadow:0 0 20px 11px #f6c26c66}.title-hero .clock{position:absolute;top:15px;left:18px;color:#ffda9a;border:1px solid #e8be81;padding:4px 9px;border-radius:6px;font-family:monospace;font-weight:900;letter-spacing:.1em;font-size:15px}.title-hero .hero-text{position:absolute;bottom:12px;left:17px;font-size:11px;color:#c8d6e6}
@media(max-width:355px){.shell{padding-left:7px;padding-right:7px}.brand h1{font-size:16px}.brand small{font-size:9px}.modal{padding:15px}.dpad{grid-template-rows:repeat(2,44px)}}
@media(min-width:700px){.shell{padding-top:22px}.toast{bottom:40px}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}

/* CHAPTER 02 / PUBLIC v1.0 */
.brand h1{color:#e5f7ff;white-space:nowrap}.frame{border-color:#7e7196;background:#101629}.top-actions button{background:#19253e}
.devflag{display:none}
.circuit4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;max-width:310px;margin:16px auto 10px;position:relative}
.circuit4 .wire{border-radius:8px}.circuit4 .wire.on{background:#255750}
.circuit4 .wire.hint{outline:2px dashed #f2c270;outline-offset:-4px}
.ports{display:flex;align-items:center;justify-content:space-between;gap:9px;color:#acd3e4;font-size:11px;max-width:310px;margin:auto}
.puzzle-stats{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:11px;color:#a9c5cf;margin-top:8px}
.dials{display:grid;gap:9px;margin:15px 0}.dialrow{display:grid;grid-template-columns:minmax(0,1fr) 44px 44px 44px;gap:6px;align-items:center;background:#1b3048;padding:7px;border-radius:10px}
.dialrow label{font-size:12px}.dialrow strong{font-variant-numeric:tabular-nums;text-align:center;font-size:23px;color:#e8f8e8}
.dialrow button{height:40px;border-radius:9px;background:#365777;color:#f2fbff;border:1px solid #7298af;font-weight:900;font-size:20px}
.dialrow .minus{grid-column:2}.dialrow strong{grid-column:3}.dialrow .plus{grid-column:4}
.evidences{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:13px 0}.evidences button{min-height:78px;padding:10px 8px;background:#203450;color:#e4f2fa;border:1px solid #6d829e;border-radius:10px;font-size:12px;line-height:1.55}.evidences button:disabled{opacity:.38}
.track{background:#122840;border-radius:8px;border:1px solid #44687a;padding:9px;font-size:12px;color:#cef1e8;margin:12px 0;min-height:40px;line-height:1.6}
.beat{font-size:25px;text-align:center;letter-spacing:.12em;min-height:40px;color:#fce4ac;margin:10px 0}
.tiny{font-size:11px;color:#bac9da;line-height:1.7}
.subtitle{color:#a9f3de}
@media(max-width:365px){.circuit4{max-width:265px}.dialrow{grid-template-columns:minmax(0,1fr) 35px 37px 35px;gap:4px}.dialrow button{height:35px}}

/* Ver.0.3 — high-contrast IN/OUT pins on the exact source/goal tiles */
.circuit4 .wire{position:relative;overflow:visible;min-width:0}
.circuit4 .wire.port-in{border:3px solid #8cc8ff;background:#173954;box-shadow:inset 0 0 0 1px #d9f3ff55,0 0 12px #5aaff84a}
.circuit4 .wire.port-out{border:3px solid #ffc273;background:#523a24;box-shadow:inset 0 0 0 1px #fff2c04a,0 0 12px #ffbb685c}
.circuit4 .wire.port-in.on,.circuit4 .wire.port-out.on{background:#205b52}
.circuit4 .wire.port-in svg path{stroke:#90d6ff}
.circuit4 .wire.port-out svg path{stroke:#ffd09a}
.port-tag{position:absolute;top:-8px;left:-4px;background:#9fd8ff;color:#0c2740;border:1px solid #edfaff;border-radius:5px;padding:1px 4px;z-index:3;font-size:10px;font-weight:1000;letter-spacing:.02em;white-space:nowrap;line-height:1.2;pointer-events:none;box-shadow:0 2px 5px #0009}
.port-tag.out{background:#ffd091;color:#442409;border-color:#fff2ce}
.circuit-port-guide{max-width:320px;margin:12px auto 5px;border:1px solid #516981;background:#12243a;border-radius:11px;padding:10px 11px;display:grid;gap:7px;font-size:12px;color:#ddeaf4;line-height:1.5}
.circuit-port-guide b{color:#ffffff}
.circuit-port-guide .in{color:#acdfff}
.circuit-port-guide .out{color:#ffd39b}
.circuit-port-guide .hintline{font-size:11px;color:#acbfcd;border-top:1px solid #445c72;padding-top:6px}
.combat-status{font-size:12px;line-height:1.7;border:1px solid #657c90;border-radius:10px;background:#152940;padding:10px 12px;margin:12px 0;color:#f0f8fe}
.combat-dice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:13px 0}
.combat-die{background:#122a40;border:1px solid #7193ac;border-radius:12px;padding:10px;text-align:center;color:#d8f4ff;min-width:0}
.combat-die.foe{background:#342534;border-color:#ac7783;color:#ffe4e6}
.combat-die strong{display:block;font-size:31px;line-height:1.25;color:#fff4d8;font-variant-numeric:tabular-nums}
.combat-die span{display:block;font-size:11px;margin-bottom:4px}
.combat-report{border-left:3px solid #e4bc84;background:#392f2c70;padding:10px 12px;margin:10px 0;line-height:1.6;font-size:13px;white-space:pre-line;color:#f6eade}
.combat-report.win{border-color:#77e3c6;background:#183d3d80;color:#d0fff1}
.combat-rule{font-size:11px;color:#b9cadd;line-height:1.6;margin-top:3px}
@media(max-width:365px){.port-tag{font-size:9px}.circuit-port-guide{font-size:11px}}
</style>
</head>
<body>
<main class="shell">
<header><div class="brand"><div class="logo">⚙</div><div><h1>CP QUEST</h1><small>あしたをつなぐ修理屋｜第2章｜公開版 v1.0</small></div></div><div class="top-actions"><button id="sound" aria-label="効果音の切り替え">♪</button><button id="journal" aria-label="調査手帳を開く">▤</button><button id="menu" aria-label="メニューを開く">☰</button></div></header>
<section class="status" aria-live="polite"><div class="stagehead"><strong id="stageTitle">風の止まった鉄橋</strong><span id="stageNum">STAGE 6 / 10</span></div><div class="progress" id="progress" aria-label="ステージ進捗"></div><div class="metarow"><div class="health" id="health" aria-label="体力"></div><span id="parts">技術部品 0</span></div><div class="objective"><b>任務：</b><span id="objective">検問所の異常を調べる</span></div></section>
<div class="frame"><canvas id="game" width="960" height="800" aria-label="探索ゲーム画面。十字キーとアクションボタンで操作します"></canvas></div>
<div class="mapkey"><span>十字キーで移動／Aで調査・ダイス戦闘<br>マップの場所をタップして移動もできる</span><span id="near">⚙ 修理屋の工房</span></div>
<div class="controls"><div class="dpad"><div class="cap">MOVE</div><button class="ctl up" data-move="0,-1" aria-label="上へ移動">▲</button><button class="ctl left" data-move="-1,0" aria-label="左へ移動">◀</button><button class="ctl down" data-move="0,1" aria-label="下へ移動">▼</button><button class="ctl right" data-move="1,0" aria-label="右へ移動">▶</button><div class="hint">HOLD<br>OK</div></div><div class="actions"><button class="primary" id="action">A　調べる / 戦闘</button><button class="secondary" id="scan">◉ スキャン</button><button class="secondary" id="help">？ 遊び方</button></div></div>
<div class="foot"><span>© CP ARCADE ・ オリジナル物語RPG</span><button id="arcade">CP ARCADEへ ↗</button></div>
</main>
<div id="toast" class="toast" role="status"></div><div id="overlay" class="overlay hidden" aria-hidden="true"><div id="modal" class="modal" role="dialog" aria-modal="true"></div></div>

const DIR=[[0,-1,1,4],[1,0,2,8],[0,1,4,1],[-1,0,8,2]];
const rotate=m=>((m<<1)&15)|((m&8)?1:0);

 let masks=Array.from({length:16},(_,i)=>[6,3,12,9,5,10,7,11][(i*3+5)%8]);let nodes=new Set();
 for(const [[ax,ay],[bx,by]] of edges){let ai=ay*4+ax,bi=by*4+bx, dx=bx-ax,dy=by-ay;
 let pair=DIR.find(d=>d[0]===dx&&d[1]===dy);if(!pair)throw Error('bad circuit path');
 if(!nodes.has(ai)){masks[ai]=0;nodes.add(ai)}if(!nodes.has(bi)){masks[bi]=0;nodes.add(bi)}masks[ai]|=pair[2];masks[bi]|=pair[3]}
 masks[4]|=8;const exits=dual?[[3,0],[3,3]]:[[3,2]];for(let [x,y] of exits)masks[y*4+x]|=2;
 const solution=[...masks];return {masks:masks.map((m,i)=>{let count=(i*7+(dual?3:1))%4;for(let j=0;j<count;j++)m=rotate(m);return m}),solution,path:nodes,exits};}

function findPath(goals){const q=[[g.x,g.y]],prev=new Map([[g.y*W+g.x,null]]);let ix=0,found=null;while(ix<q.length){let [x,y]=q[ix++],key=y*W+x;if(goals.some(p=>p.x===x&&p.y===y)){found=key;break}for(const [dx,dy] of [[0,-1],[1,0],[0,1],[-1,0]]){let xx=x+dx,yy=y+dy,k=yy*W+xx;if(!mapOK(xx,yy)||enemyAt(xx,yy)||prev.has(k))continue;prev.set(k,key);q.push([xx,yy])}}if(found===null)return null;let path=[];while(prev.get(found)!==null){path.push([found%W,Math.floor(found/W)]);found=prev.get(found)}return path.reverse()}
function tapMove(x,y){if(mode!=='play')return;stopAuto();let enemy=enemyAt(x,y),obj=objectAt(x,y),goals=[],done=()=>{};

 else if(obj){if(dist(obj,g)<=1){interact(obj);return}goals=[[x,y],[x-1,y],[x+1,y],[x,y-1],[x,y+1]].filter(([xx,yy])=>mapOK(xx,yy)).map(([x,y])=>({x,y}));done=()=>{if(visible(obj)&&dist(g,obj)<=1)interact(obj)}}
 else goals=[{x,y}];
 if(!findPath(goals)){toast('通れる道が見つからない');return}
 let steps=0,stalled=0;
 function tick(){if(mode!=='play'){stopAuto();return}if((enemy||obj)&&dist(g,{x,y})<=1){stopAuto();done();return}let p=findPath(goals);if(!p){stopAuto();toast('敵に道を塞がれた。十字キーで近づいてA');return}if(!p.length){stopAuto();done();return}let [xx,yy]=p[0],px=g.x,py=g.y;move(xx-px,yy-py);if(g.x===px&&g.y===py){if(++stalled>=4){stopAuto();toast('ここは手動で進もう');return}}else stalled=0;
